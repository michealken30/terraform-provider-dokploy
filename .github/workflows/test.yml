name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  docs:
    name: Verify Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.*'
          terraform_wrapper: false
      - name: Generate docs
        run: go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@latest generate
      - name: Check for uncommitted changes
        run: |
          if [[ -n "$(git status --porcelain docs/)" ]]; then
            echo "Documentation is out of date. Run 'make docs' and commit the changes."
            git diff docs/
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./internal/client/... ./internal/provider/...
      - name: Coverage analysis
        run: go run ./tools/coverage -coverprofile=coverage.out -threshold=99 ./internal
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      TF_ACC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.*'
          terraform_wrapper: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Load cached images
        run: |
          if [ -f /tmp/docker-cache/images.tar ]; then
            docker load -i /tmp/docker-cache/images.tar || true
          fi

      - name: Pull Docker images
        run: |
          docker pull postgres:16-alpine &
          docker pull redis:7-alpine &
          docker pull dokploy/dokploy:latest &
          wait

      - name: Save Docker images to cache
        run: |
          mkdir -p /tmp/docker-cache
          docker save postgres:16-alpine redis:7-alpine dokploy/dokploy:latest -o /tmp/docker-cache/images.tar

      - name: Start Dokploy
        run: docker compose up -d
        working-directory: .

      - name: Wait for Dokploy to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Dokploy is ready"
              exit 0
            fi
            echo "Waiting for Dokploy... ($i/30)"
            sleep 5
          done
          echo "Dokploy failed to start"
          exit 1

      - name: Bootstrap Dokploy and get API key
        id: bootstrap
        run: |
          # Register admin user and capture session cookie
          COOKIE_JAR=$(mktemp)
          curl -sf -c "$COOKIE_JAR" -X POST http://localhost:3000/api/auth/sign-up/email \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@test.local","password":"TestPassword123!","name":"Admin","lastName":"User"}'

          # Get session token from cookie jar
          SESSION_TOKEN=$(grep 'better-auth.session_token' "$COOKIE_JAR" | awk '{print $NF}')
          if [ -z "$SESSION_TOKEN" ]; then
            echo "Failed to get session token"
            exit 1
          fi

          # Get organization ID
          USER_INFO=$(curl -sf http://localhost:3000/api/user.get \
            -H "Cookie: better-auth.session_token=$SESSION_TOKEN")
          ORG_ID=$(echo "$USER_INFO" | jq -r '.organizationId')

          # Create API key
          API_KEY=$(curl -sf -X POST http://localhost:3000/api/user.createApiKey \
            -H "Content-Type: application/json" \
            -H "Cookie: better-auth.session_token=$SESSION_TOKEN" \
            -d "{\"name\":\"terraform-test\",\"rateLimitEnabled\":false,\"metadata\":{\"organizationId\":\"$ORG_ID\"}}" \
            | jq -r '.key')

          if [ -z "$API_KEY" ] || [ "$API_KEY" = "null" ]; then
            echo "Failed to get API key"
            exit 1
          fi

          echo "api_key=$API_KEY" >> $GITHUB_OUTPUT
          rm -f "$COOKIE_JAR"

      - name: Run acceptance tests
        run: go test -v -timeout 60m ./internal/...
        env:
          DOKPLOY_HOST: http://localhost:3000
          DOKPLOY_API_KEY: ${{ steps.bootstrap.outputs.api_key }}

      - name: Stop Dokploy
        if: always()
        run: docker compose down -v
