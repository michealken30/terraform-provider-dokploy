version: "3.8"

# Local Dokploy instance for Terraform provider testing
# Usage:
#   docker compose up -d      # Start Dokploy
#   docker compose down -v    # Stop and remove all data
#   docker compose logs -f    # View logs

services:
  postgres:
    image: postgres:16-alpine
    container_name: dokploy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dokploy
      POSTGRES_PASSWORD: dokploy-local-dev
      POSTGRES_DB: dokploy
    volumes:
      - dokploy-postgres-data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokploy -d dokploy"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dokploy-redis
    restart: unless-stopped
    volumes:
      - dokploy-redis-data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dokploy:
    image: dokploy/dokploy:latest
    container_name: dokploy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://dokploy:dokploy-local-dev@postgres:5432/dokploy
      - REDIS_URL=redis://redis:6379
      - DOKPLOY_HOST=http://192.168.1.24:3000
    volumes:
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
      # Dokploy configuration
      - dokploy-config:/etc/dokploy
      # SSH keys (optional, for remote servers)
      - dokploy-ssh:/root/.ssh
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  dokploy-network:
    driver: bridge

volumes:
  dokploy-postgres-data:
  dokploy-redis-data:
  dokploy-config:
  dokploy-ssh:
