run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - staticcheck
    - gofmt
    - goimports
    - ineffassign
    - typecheck
    - unused

linters-settings:
  goimports:
    local-prefixes: github.com/reserve-protocol/terraform-provider-dokploy

issues:
  exclude-dirs:
    - tools

  exclude-rules:
    # Exclude some linters from running on tests files.
    - path: _test\.go
      linters:
        - errcheck
